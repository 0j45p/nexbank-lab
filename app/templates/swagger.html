<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>NexBank Internal API Docs</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css">
</head>
<body>
  <!-- Lab 13: meant for the internal platform team only — no auth gate, no
       robots.txt disallow, linked from nowhere but still fully reachable. -->

    window.onload = function() {
      SwaggerUIBundle({ url: '/api/openapi.json', dom_id: '#swagger-ui' });
    };
  </script>
</body>
</html>
